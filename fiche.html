<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiche de personnage — Codex des héros</title>
  <meta name="theme-color" content="#2d1a12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f4ecd9'/%3E%3Cpath d='M16 3 L27 16 L16 29 L5 16 Z' fill='%23bf9443'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%239f2f1f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=IM+Fell+French+Canon&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/codex.css">
  <link rel="stylesheet" href="css/fiche.css">
  <link rel="stylesheet" href="css/codex-ajouts.css">
  <script>document.documentElement.classList.add('js');</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="js/commun.js" defer></script>
  <script src="js/regles.js" defer></script>
  <script src="js/telechargement.js" defer></script>
  <script src="js/fiche.js" defer></script>
</head>
<body class="cuir">

  <!-- Ornements réutilisables -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="etoile" viewBox="0 0 48 48">
      <path d="M24 2 L28.5 16 L38 10 L32 19.5 L46 24 L32 28.5 L38 38 L28.5 32 L24 46 L19.5 32 L10 38 L16 28.5 L2 24 L16 19.5 L10 10 L19.5 16 Z"/>
    </symbol>
    <symbol id="coin" viewBox="0 0 48 48">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M2 40 V14 Q2 2 14 2 H40" stroke-width="1.1"/>
        <path d="M14 14 C22 14 26 20 26 26 C26 31 21 33 18.5 30.5 C16 28 18 24.5 21 25.5" stroke-width=".9"/>
      </g>
      <path fill="currentColor" d="M14 10 L18 14 L14 18 L10 14 Z"/>
    </symbol>
    <symbol id="fleuron" viewBox="0 0 320 28">
      <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
        <path d="M6 14 H110"/><path d="M210 14 H314"/>
        <path d="M118 14 C128 14 132 5 142 5 C148 5 150 10 146 12"/>
        <path d="M118 14 C128 14 132 23 142 23 C148 23 150 18 146 16"/>
        <path d="M202 14 C192 14 188 5 178 5 C172 5 170 10 174 12"/>
        <path d="M202 14 C192 14 188 23 178 23 C172 23 170 18 174 16"/>
      </g>
      <g fill="currentColor">
        <circle cx="3" cy="14" r="1.8"/><circle cx="317" cy="14" r="1.8"/>
        <path d="M114 11 L117 14 L114 17 L111 14 Z"/><path d="M206 11 L209 14 L206 17 L203 14 Z"/>
        <path d="M160 3 L168 14 L160 25 L152 14 Z"/>
        <circle cx="146" cy="14" r="1.6"/><circle cx="174" cy="14" r="1.6"/>
      </g>
    </symbol>
    <symbol id="fleche-retour" viewBox="0 0 24 24">
      <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="telecharger" viewBox="0 0 24 24">
      <path d="M12 4 V15 M7 10.5 L12 15.5 L17 10.5 M5 19.5 H19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <!-- ═══ BARRE ═══ -->
  <header class="barre">
    <a class="barre-marque" href="index.html">Codex des héros</a>
    <div class="barre-actions" id="barreActions" hidden>
      <button type="button" class="bouton bouton--cuir" id="btnNouveau">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#fleche-retour"/></svg>
        Nouvelle création
      </button>
      <button type="button" class="bouton bouton--cuir" id="btnTelecharger">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#telecharger"/></svg>
        <span class="libelle">Télécharger ma fiche</span>
      </button>
      <button type="button" class="bouton bouton--or" id="btnPDF">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#telecharger"/></svg>
        Exporter en PDF
      </button>
    </div>
  </header>

  <main class="fiche-page" id="contenu">

    <!-- ═══ CHARTE ═══ -->
    <article class="charte" id="characterSheet" hidden>
      <svg class="coin coin--hg" aria-hidden="true"><use href="#coin"/></svg>
      <svg class="coin coin--hd" aria-hidden="true"><use href="#coin"/></svg>
      <svg class="coin coin--bg" aria-hidden="true"><use href="#coin"/></svg>
      <svg class="coin coin--bd" aria-hidden="true"><use href="#coin"/></svg>

      <header class="charte-tete">
        <p class="surtitre">Fiche de personnage</p>
        <h1 class="charte-nom" id="nomComplet"></h1>
        <p class="charte-lignee">
          <button type="button" class="lien-race" id="race" aria-haspopup="dialog" title="Voir la chronique de cette race"></button>
          <span class="sep" aria-hidden="true">·</span>
          <span id="metier"></span>
        </p>
        <svg class="fleuron" viewBox="0 0 320 28" aria-hidden="true"><use href="#fleuron"/></svg>
      </header>

      <section class="charte-identite revele" aria-label="Identité">
        <div class="medaillon charte-portrait">
          <div class="medaillon-interieur" id="imagePreview"></div>
        </div>
        <div class="identite-details">
          <dl class="identite-liste">
            <div><dt>Âge</dt><dd id="age"></dd></div>
            <div><dt>Genre</dt><dd id="genre"></dd></div>
            <div><dt>Origine</dt><dd id="nationalite"></dd></div>
            <div><dt>Vocation</dt><dd id="vocation"></dd></div>
          </dl>
          <div class="vitaux vitaux--grands">
            <div class="vital vital--pv">
              <span class="vital-medaillon" id="pvValue">—</span>
              <span class="vital-libelle">Points<br>de vie</span>
            </div>
            <div class="vital vital--magie">
              <span class="vital-medaillon" id="magieValue">—</span>
              <span class="vital-libelle">Réserve<br>de magie</span>
            </div>
          </div>
        </div>
      </section>

      <section class="charte-section revele" aria-labelledby="t-competences">
        <h2 class="titre-filet" id="t-competences">Compétences</h2>
        <ul class="competences" id="skillsGrid"></ul>
        <p class="legende">
          <span class="legende-pastille legende-pastille--base"></span> valeur de race
          <span class="legende-pastille legende-pastille--bonus"></span> bonus de métier
          <span class="legende-echelle">— jauge sur 15</span>
        </p>
      </section>

      <section class="charte-section revele" aria-labelledby="t-don">
        <h2 class="titre-filet" id="t-don">Don du métier</h2>
        <div class="don">
          <span class="lettrine-bloc lettrine-bloc--rubrique" aria-hidden="true"><span id="donInitiale"></span></span>
          <p class="don-nom" id="pouvoirName"></p>
          <p class="don-effet" id="pouvoirEffect"></p>
        </div>
      </section>

      <section class="charte-section revele" id="apparenceSection" aria-labelledby="t-apparence" hidden>
        <h2 class="titre-filet" id="t-apparence">Apparence</h2>
        <div id="descriptionTexte"></div>
      </section>

      <footer class="charte-pied">
        <span class="cire cire--mini" aria-hidden="true"><svg viewBox="0 0 48 48"><use href="#etoile"/></svg></span>
        <p id="colophon">Inscrit au Codex des héros</p>
      </footer>
    </article>

  </main>

  <!-- ═══ FOLIO : chronique de la race ═══ -->
  <dialog class="folio" id="raceModal" aria-labelledby="modalRaceTitle">
    <div class="folio-cadre">
      <button type="button" class="folio-fermer" data-fermer aria-label="Fermer">×</button>
      <div id="modalRaceContent"></div>
      <div class="folio-actions">
        <button type="button" class="bouton" data-fermer>Refermer</button>
      </div>
    </div>
  </dialog>

</body>
</html>
